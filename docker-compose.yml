services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/database.db
    volumes:
      - backend_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./FriendKitchen
      dockerfile: Dockerfile
    ports:
      - "8003:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
